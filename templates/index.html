<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#212529;
            position:fixed;
            padding-top:20px;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:15px;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#343a40;
        }

        .content{
            margin-left:260px;
            padding:30px;
        }

        .card-box{
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3 class="text-white text-center mb-4">
        Library Admin
    </h3>

    <a href="/">Dashboard</a>
    <a href="/books">Books</a>
    <a href="/add_book">Add Book</a>
    <a href="/borrow_records">Borrow Records</a>
    <a href="/logout">Logout</a>

</div>

<div class="content">

    <h1 class="mb-4">
        Dashboard
    </h1>
    <a
    href="/generate_report"
    class="btn btn-dark mb-4"
    >
        Generate PDF Report
   </a>

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card shadow p-4 card-box">

                <h5>Total Books</h5>

                <h1>{{ total_books }}</h1>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow p-4 card-box">

                <h5>Borrowed Books</h5>

                <h1>{{ borrowed_books }}</h1>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow p-4 card-box">

                <h5>Returned Books</h5>

                <h1>{{ returned_books }}</h1>

            </div>

        </div>

    </div>

    <div class="card shadow p-4">

        <h4 class="mb-4">
            Library Statistics
        </h4>

        <canvas id="libraryChart"></canvas>

    </div>

</div>

<script>

const ctx = document.getElementById('libraryChart');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: [
            'Total Books',
            'Borrowed',
            'Returned'
        ],

        datasets: [{

            label: 'Library Data',

            data: [
                {{ total_books }},
                {{ borrowed_books }},
                {{ returned_books }}
            ],

            borderWidth: 1

        }]
    },

    options: {

        responsive: true,

        scales: {

            y: {
                beginAtZero: true
            }

        }

    }

});

</script>

</body>
</html>
