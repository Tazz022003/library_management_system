<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .login-box{
            width:400px;
            margin:auto;
            margin-top:100px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Library Login
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >

            </div>

            <button class="btn btn-dark w-100">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
