<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="mb-4">Add Book</h1>

        <form method="POST" enctype="multipart/form-data">

             <div class="mb-3">

                 <label>Book Cover</label>

                <input
                   type="file"
                   name="cover_image"
                  class="form-control"
                >

            </div>

            <div class="mb-3">
                <label>Book Title</label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Author</label>

                <input
                    type="text"
                    name="author"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    required
                >
            </div>

            <button class="btn btn-success">
                Save Book
            </button>

            <a href="/books" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
