<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="mb-4">Edit Book</h1>

        <form method="POST">

            <div class="mb-3">
                <label>Title</label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ book[1] }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Author</label>

                <input
                    type="text"
                    name="author"
                    class="form-control"
                    value="{{ book[2] }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ book[3] }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Quantity</label>

                <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    value="{{ book[4] }}"
                    required
                >
            </div>

            <button class="btn btn-success">
                Update Book
            </button>

            <a href="/books" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
