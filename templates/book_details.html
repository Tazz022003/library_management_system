<!DOCTYPE html>
<html>
<head>

    <title>Book Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="row">

            <div class="col-md-4">

                {% if book[5] %}

                <img
                    src="{{ url_for('static', filename='uploads/' + book[5]) }}"
                    class="img-fluid rounded"
                >

                {% endif %}

            </div>

            <div class="col-md-8">

                <h1>{{ book[1] }}</h1>

                <hr>

                <h5>Author:</h5>
                <p>{{ book[2] }}</p>

                <h5>Category:</h5>
                <p>{{ book[3] }}</p>

                <h5>Available Quantity:</h5>
                <p>{{ book[4] }}</p>

                <a
                    href="/borrow_book/{{ book[0] }}"
                    class="btn btn-primary"
                >
                    Borrow Book
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
