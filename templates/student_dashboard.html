<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{
            background:#f4f6f9;
        }

        .dashboard-card{
            border:none;
            border-radius:20px;
        }

        .search-box{
            max-width:450px;
        }

        .table{
            vertical-align:middle;
        }

        .badge-stock{
            font-size:14px;
            padding:8px 14px;
            border-radius:30px;
        }

        .dashboard-title{
            font-weight:700;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="dashboard-title">
            Student Dashboard
        </h1>

        <a
            href="/logout"
            class="btn btn-danger"
        >
            Logout
        </a>

    </div>


    <!-- BOOK LIST -->
    <div class="card shadow dashboard-card">

        <div class="card-body">

            <!-- TITLE + SEARCH -->
            <div
                class="
                d-flex
                justify-content-between
                align-items-center
                flex-wrap
                mb-4
                "
            >

                <h4 class="mb-3 mb-md-0">
                    Available Books
                </h4>

                <form
                    method="GET"
                    class="search-box"
                >

                    <div class="input-group">

                        <input
                            type="text"
                            name="search"
                            class="form-control"

                            placeholder="Search by title or author..."

                            value="{{ search }}"
                        >

                        <button
                            class="btn btn-primary"
                            type="submit"
                        > Search</button>

                        <a
                            href="/student_dashboard"
                            class="btn btn-secondary"
                        >
                            Back
                        </a>

                    </div>

                </form>

            </div>


            <!-- TABLE -->
            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

                    {% if books %}

                        {% for book in books %}

                        <tr>

                            <td>
                                {{ book[1] }}
                            </td>

                            <td>
                                {{ book[2] }}
                            </td>

                            <td>
                                {{ book[3] }}
                            </td>

                            <td>

                                {% if book[4] > 0 %}

                                    <span class="badge bg-success badge-stock">

                                        Available
                                        ({{ book[4] }})

                                    </span>

                                {% else %}

                                    <span class="badge bg-danger badge-stock">

                                        Unavailable

                                    </span>

                                {% endif %}

                            </td>

                        </tr>

                        {% endfor %}

                    {% else %}

                    <tr>

                        <td
                            colspan="4"
                            class="text-center text-muted py-4"
                        >

                            No books found.

                        </td>

                    </tr>

                    {% endif %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
