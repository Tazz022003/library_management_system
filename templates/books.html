<!DOCTYPE html>
<html>
<head>
    <title>Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#212529;
            position:fixed;
            padding-top:20px;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:15px;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#343a40;
        }

        .content{
            margin-left:260px;
            padding:30px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3 class="text-white text-center mb-4">
        Library
    </h3>

    <a href="/">Dashboard</a>
    <a href="/books">Books</a>
    <a href="/add_book">Add Book</a>
    <a href="/borrow_records">Borrow Records</a>

</div>

<div class="content">

    <div class="d-flex justify-content-between mb-3">

        <h1>Books List</h1>

        <a href="/add_book" class="btn btn-primary">
            Add Book
        </a>

    </div>

    <form method="GET" class="mb-3">

        <div class="input-group">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search books..."
            >

            <button class="btn btn-dark">
                Search
            </button>

        </div>

    </form>

    <div class="card shadow p-3">

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

                {% for book in books %}

                <tr>

                    <td>{{ book[0] }}</td>
                    <td>{{ book[1] }}</td>
                    <td>{{ book[2] }}</td>
                    <td>{{ book[3] }}</td>
                    <td>{{ book[4] }}</td>

                    <td>

                        </a>
                        <a
                           href="/borrow_book/{{ book[0] }}"
                           class="btn btn-primary btn-sm"
                        >
                           Borrow
                        </a>

                        <a
                            href="/edit_book/{{ book[0] }}"
                            class="btn btn-warning btn-sm"
                        >
                            Edit
                        </a>

                        <a
                            href="/delete_book/{{ book[0] }}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this book?')"
                        >
                            Delete
                        </a>
                        

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
