<!DOCTYPE html>
<html>
<head>
    <title>Admin Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .profile-card{
            max-width:500px;
            margin:auto;
            margin-top:80px;
            border-radius:20px;
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card shadow p-4 profile-card text-center">

        <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            class="profile-img mx-auto mb-3"
        >

        <h2>{{ user[1] }}</h2>

        <p class="text-muted">
            @{{ user[2] }}
        </p>

        <span class="badge bg-dark mb-3">
            {{ user[4] }}
        </span>

        <div>

            <a href="/" class="btn btn-primary">
                Back Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
